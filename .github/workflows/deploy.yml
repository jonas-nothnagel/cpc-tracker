name: Deploy to Azure App Service

# Push :latest to ACR; the ACR webhook (cpctrackerCD) tells App Service to pull.
# No Azure CLI / service principal needed in this workflow because role-assignment
# write isn't available on this subscription. To upgrade to az-login-based deploys,
# ask an Azure admin to grant a service principal Web Site Contributor on the web
# app and AcrPush on the registry, then swap this for the original deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN: policycoherence.azurecr.io
  IMAGE_NAME: cpc-tracker

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Smoke test (App Service auto-pulls via ACR webhook)
        run: |
          # Webhook fires asynchronously; give App Service up to 5 min to pull and warm up.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://cpc-tracker-c657.azurewebsites.net/" || echo timeout)
            echo "[$i/30] $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "App did not return 200 within 5 minutes — check container logs"
          exit 1
